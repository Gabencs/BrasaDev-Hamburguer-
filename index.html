<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Brasa Dev — Gestão da hamburgueria</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <svg viewBox="0 0 24 24" width="26" height="26">
            <path
              fill="#D9431E"
              d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 1 1 1 2 2 2 0-3-1-5 1-8z"
            /></svg
          >Brasa Dev
        </div>
        <div class="sub">Gestão da hamburgueria</div>
        <div id="nav"></div>
        <div class="foot">
          <button onclick="reset()">Restaurar dados de exemplo</button
          ><button onclick="logout()">Sair da conta</button>Versão 1.01
        </div>
      </aside>
      <main id="main"></main>
    </div>
    <input type="file" id="pf" accept="image/*" hidden onchange="salvarFoto(this)" />
    <div id="auth" hidden></div>
    <dialog id="dlg"></dialog>
    <div id="toast" role="status"></div>
    <script src="app.js"></script>
  </body>
</html>
